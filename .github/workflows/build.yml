name: Build Windows Executable
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller>=6.0
        pip install -r requirements.txt

    - name: Show installed versions
      run: pip list

    # traces.ico (the .exe, installer and uninstaller icon) is generated
    # from src/assets/traces_icon.svg with PyQt6's SVG renderer, so the
    # icon always matches the artwork and needs no separate tool.
    - name: Generate Windows icon
      run: python src/assets/make_icons.py

    # Packages are collected as compiled modules, not copied as source:
    # --collect-submodules bundles every module of a package, including
    # those PyInstaller can't see from import statements -- the lazy
    # (PEP 562) re-exports in each package's __init__.py, and the
    # data_import processor classes ImportDialog loads by name from the
    # JSON configs. Package order follows the dependency order
    # (utils, data_import, ui_kit, analysis, plot, gui); utils.py is a
    # top-level module and is found from the entry script's imports.
    #
    # Data files: config/ and assets/ are read through
    # utils.get_resource_path; ui_kit/plot_view.js is read through
    # importlib.resources (ui_kit.plot_export.load_asset) and must sit in
    # a ui_kit folder. Only the two SVGs the application draws are bundled
    # from assets/ -- not make_icons.py or the generated traces.ico.
    #
    # --icon sets the .exe's icon (Explorer, shortcuts, taskbar pins);
    # the window icon at run time comes from traces_icon.svg.
    - name: Build with PyInstaller
      shell: powershell
      run: |
        pyinstaller --name "trajectory_tools" --onedir --windowed `
          --icon src/assets/traces.ico `
          --paths src `
          --add-data "src/config;config" `
          --add-data "src/assets/traces_logo.svg;assets" `
          --add-data "src/assets/traces_icon.svg;assets" `
          --add-data "src/ui_kit/plot_view.js;ui_kit" `
          --collect-submodules data_import `
          --collect-submodules ui_kit `
          --collect-submodules analysis `
          --collect-submodules plot `
          --collect-submodules gui `
          --hidden-import PyQt6 `
          --hidden-import PyQt6.QtSvg `
          --hidden-import pyqtgraph `
          --hidden-import superqt `
          --hidden-import utm `
          src/traces.py

    # PyInstaller records modules it couldn't find in a warn file instead of
    # failing the build -- a package missing from requirements.txt (as scipy
    # once was) shows up only there. Fail on any required package listed as
    # missing; optional ones (e.g. OpenGL for pyqtgraph.opengl) are ignored.
    # A missing logo or icon SVG wouldn't stop the application -- it logs a
    # warning and runs unbranded -- so check for them here too.
    - name: Check bundled data files and packages
      shell: powershell
      run: |
        $required = @(
          "dist/trajectory_tools/_internal/ui_kit/plot_view.js",
          "dist/trajectory_tools/_internal/config",
          "dist/trajectory_tools/_internal/assets/traces_logo.svg",
          "dist/trajectory_tools/_internal/assets/traces_icon.svg",
          "src/assets/traces.ico"
        )
        foreach ($path in $required) {
          if (-not (Test-Path $path)) { Write-Error "Missing from build: $path"; exit 1 }
        }
        $warn = "build/trajectory_tools/warn-trajectory_tools.txt"
        $packages = "scipy|numpy|pyqtgraph|superqt|PyQt6|utm"
        $missing = Select-String -Path $warn -Pattern "^missing module named '?($packages)'? -"
        if ($missing) {
          $missing | ForEach-Object { Write-Host $_.Line }
          Write-Error "Required package(s) missing from the build; check requirements.txt"
          exit 1
        }

    - name: Install NSIS
      run: choco install nsis --yes --no-progress

    - name: Write NSIS script
      shell: powershell
      run: |
        $nsis = @'
        Unicode True
        !define APP_NAME      "Trajectory Tools"
        !define APP_VERSION   "0.1"
        !define APP_EXE       "trajectory_tools.exe"
        !define INSTALL_REG   "Software\TrajectoryTools"
        !define UNINSTALL_REG "Software\Microsoft\Windows\CurrentVersion\Uninstall\TrajectoryTools"

        Name "${APP_NAME} ${APP_VERSION}"
        OutFile "trajectory_tools_setup.exe"
        InstallDir "$PROGRAMFILES64\TrajectoryTools"
        InstallDirRegKey HKLM "${INSTALL_REG}" "InstallDir"
        RequestExecutionLevel admin

        ;-- Installer and uninstaller icons (generated by make_icons.py)
        !define MUI_ICON   "src\assets\traces.ico"
        !define MUI_UNICON "src\assets\traces.ico"

        ;-- Modern UI pages
        !include "MUI2.nsh"
        !insertmacro MUI_PAGE_WELCOME
        !insertmacro MUI_PAGE_DIRECTORY
        !insertmacro MUI_PAGE_INSTFILES
        !insertmacro MUI_PAGE_FINISH
        !insertmacro MUI_UNPAGE_CONFIRM
        !insertmacro MUI_UNPAGE_INSTFILES
        !insertmacro MUI_LANGUAGE "English"

        ;------------------------------------------------------------
        Section "Install"
          SetOutPath "$INSTDIR"

          ;-- Copy entire PyInstaller onedir output
          File /r "dist\trajectory_tools\*.*"

          ;-- Start Menu shortcut
          CreateDirectory "$SMPROGRAMS\TrajectoryTools"
          CreateShortcut "$SMPROGRAMS\TrajectoryTools\Trajectory Tools.lnk" \
                         "$INSTDIR\${APP_EXE}"
          CreateShortcut "$SMPROGRAMS\TrajectoryTools\Uninstall.lnk" \
                         "$INSTDIR\uninstall.exe"

          ;-- Desktop shortcut
          CreateShortcut "$DESKTOP\Trajectory Tools.lnk" "$INSTDIR\${APP_EXE}"

          ;-- Registry: record install dir and version
          WriteRegStr   HKLM "${INSTALL_REG}" "InstallDir" "$INSTDIR"
          WriteRegStr   HKLM "${INSTALL_REG}" "Version"    "${APP_VERSION}"

          ;-- Registry: Add/Remove Programs entry (DisplayIcon: the icon
          ;-- shown in Settings > Apps, taken from the .exe)
          WriteRegStr   HKLM "${UNINSTALL_REG}" "DisplayName"     "${APP_NAME}"
          WriteRegStr   HKLM "${UNINSTALL_REG}" "DisplayVersion"  "${APP_VERSION}"
          WriteRegStr   HKLM "${UNINSTALL_REG}" "DisplayIcon"     "$INSTDIR\${APP_EXE}"
          WriteRegStr   HKLM "${UNINSTALL_REG}" "Publisher"       "Trajectory Tools"
          WriteRegStr   HKLM "${UNINSTALL_REG}" "UninstallString" "$INSTDIR\uninstall.exe"
          WriteRegStr   HKLM "${UNINSTALL_REG}" "InstallLocation" "$INSTDIR"
          WriteRegDWORD HKLM "${UNINSTALL_REG}" "NoModify"        1
          WriteRegDWORD HKLM "${UNINSTALL_REG}" "NoRepair"        1

          WriteUninstaller "$INSTDIR\uninstall.exe"
        SectionEnd

        ;------------------------------------------------------------
        Section "Uninstall"
          ;-- Remove install tree (does not touch APPDATA user configs)
          RMDir /r "$INSTDIR"

          ;-- Remove shortcuts
          Delete "$DESKTOP\Trajectory Tools.lnk"
          RMDir /r "$SMPROGRAMS\TrajectoryTools"

          ;-- Remove registry keys
          DeleteRegKey HKLM "${INSTALL_REG}"
          DeleteRegKey HKLM "${UNINSTALL_REG}"
        SectionEnd
        '@
        $nsis | Out-File -FilePath installer.nsi -Encoding utf8

    # makensis.exe's location varies with the runner image and the NSIS
    # package version (Program Files vs. Program Files (x86), with or
    # without a Bin folder), so find it rather than hard-code a path.
    - name: Build installer
      shell: powershell
      run: |
        $candidates = @(
          (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source,
          "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
          "${env:ProgramFiles(x86)}\NSIS\Bin\makensis.exe",
          "$env:ProgramFiles\NSIS\makensis.exe",
          "$env:ProgramFiles\NSIS\Bin\makensis.exe"
        ) | Where-Object { $_ -and (Test-Path $_) }
        $makensis = $candidates | Select-Object -First 1
        if (-not $makensis) {
          # Last resort: search the usual install roots a few levels deep.
          $roots = @("${env:ProgramFiles(x86)}", "$env:ProgramFiles", "$env:ProgramData\chocolatey") |
                   Where-Object { $_ -and (Test-Path $_) }
          $makensis = Get-ChildItem -Path $roots -Filter makensis.exe -Recurse -Depth 4 `
                        -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
        }
        if (-not $makensis) { Write-Error "makensis.exe not found after installing NSIS"; exit 1 }
        Write-Host "Using $makensis"
        & $makensis installer.nsi
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Upload portable build
      uses: actions/upload-artifact@v4
      with:
        name: trajectory_tools_portable
        path: dist/trajectory_tools/*
        retention-days: 7

    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: trajectory_tools_installer
        path: trajectory_tools_setup.exe
        retention-days: 7
