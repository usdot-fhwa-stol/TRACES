name: Run pytest unit tests

on:
  push:
    branches:
      - '**'  # Matches all branches
  pull_request:
    branches:
      - '**'  # Matches all branches

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # Adjust to your preferred Python version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest pytest-mock utm PyQt6

      - name: Run tests with Xvfb
        run: |
          xvfb-run --auto-servernum --server-args='-screen 0 1280x720x24' pytest tests/ --verbose
        env:
          PYTHONPATH: src
          QT_LOGGING_RULES: qt6.accessibility.warning=false  # Suppress accessibility warnings
