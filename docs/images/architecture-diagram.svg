<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1040" height="640" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>

  <text x="520" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Trajectory Tools — Module Architecture</text>

  <!-- Connectors (drawn first so boxes and labels sit on top) -->
  <g stroke="#555555" stroke-width="1.5" fill="none">
    <!-- Entry -> GUI -->
    <line x1="520" y1="96" x2="520" y2="128" marker-end="url(#arrow)"/>

    <!-- GUI fan-out -->
    <line x1="520" y1="194" x2="130" y2="228" marker-end="url(#arrow)"/>
    <line x1="520" y1="194" x2="385" y2="228" marker-end="url(#arrow)"/>
    <line x1="520" y1="194" x2="635" y2="228" marker-end="url(#arrow)"/>
    <line x1="520" y1="194" x2="880" y2="228" marker-end="url(#arrow)"/>

    <!-- Row3 -> DB -->
    <line x1="150" y1="334" x2="250" y2="442" marker-end="url(#arrow)"/>
    <line x1="330" y1="334" x2="380" y2="442" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="560" y1="334" x2="410" y2="442" marker-end="url(#arrow)"/>
    <polyline points="800,334 800,420 300,420 300,442" marker-end="url(#arrow)"/>

    <!-- Row3 -> Output -->
    <polyline points="440,334 440,360 620,360 620,442" marker-end="url(#arrow)"/>
    <line x1="710" y1="334" x2="750" y2="442" marker-end="url(#arrow)"/>
    <line x1="950" y1="334" x2="850" y2="442" marker-end="url(#arrow)"/>

    <!-- Shockwave: comp -.-> plot (unlabeled here; see legend) -->
    <line x1="500" y1="282" x2="530" y2="282" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  </g>

  <!-- Edge labels, each on a white halo so any connector crossing beneath it is masked -->
  <g font-size="11.5" fill="#444444" text-anchor="middle">
    <rect x="130" y="383" width="140" height="18" fill="#ffffff"/>
    <text x="200" y="396">import_data()</text>

    <rect x="350" y="373" width="160" height="18" fill="#ffffff"/>
    <text x="430" y="386">read / ALTER TABLE</text>

    <rect x="555" y="343" width="60" height="16" fill="#ffffff"/>
    <text x="585" y="355">reads</text>

    <rect x="600" y="403" width="100" height="16" fill="#ffffff"/>
    <text x="650" y="415">raw events</text>
  </g>

  <!-- Entry -->
  <rect x="420" y="46" width="200" height="50" rx="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="520" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">trajectory_tools.py</text>
  <text x="520" y="84" text-anchor="middle" font-size="11" fill="#666666">entry point</text>

  <!-- GUI -->
  <rect x="320" y="130" width="400" height="64" rx="10" fill="#e8eef7" stroke="#3a6ea5" stroke-width="1.5"/>
  <text x="520" y="156" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">gui/</text>
  <text x="520" y="174" text-anchor="middle" font-size="12" fill="#333333">MainWindow — menu bar · SQLite connection</text>

  <!-- data_import -->
  <rect x="20" y="230" width="220" height="104" rx="10" fill="#fdf3e3" stroke="#b8860b" stroke-width="1.5"/>
  <text x="130" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">data_import/</text>
  <text x="130" y="276" text-anchor="middle" font-size="12" fill="#333333">BaseProcess subclasses</text>
  <text x="130" y="292" text-anchor="middle" font-size="12" fill="#333333">(CsvProcess, ...)</text>

  <!-- comp -->
  <rect x="270" y="230" width="230" height="104" rx="10" fill="#fdf3e3" stroke="#b8860b" stroke-width="1.5"/>
  <text x="385" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">comp/</text>
  <text x="385" y="270" text-anchor="middle" font-size="11.5" fill="#333333">BaseComp subclasses</text>
  <text x="385" y="286" text-anchor="middle" font-size="11.5" fill="#333333">Jerk · Missing Data · Consistency</text>
  <text x="385" y="302" text-anchor="middle" font-size="11.5" fill="#333333">Shockwave · Spline</text>

  <!-- plot -->
  <rect x="530" y="230" width="210" height="104" rx="10" fill="#fdf3e3" stroke="#b8860b" stroke-width="1.5"/>
  <text x="635" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">plot/</text>
  <text x="635" y="276" text-anchor="middle" font-size="12" fill="#333333">TimeSpacePlotWidget</text>
  <text x="635" y="292" text-anchor="middle" font-size="12" fill="#333333">+ InteractionModes</text>

  <!-- ExportDialog -->
  <rect x="770" y="230" width="220" height="104" rx="10" fill="#e8eef7" stroke="#3a6ea5" stroke-width="1.5"/>
  <text x="880" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">ExportDialog</text>
  <text x="880" y="276" text-anchor="middle" font-size="12" fill="#333333">(gui/)</text>
  <text x="880" y="292" text-anchor="middle" font-size="12" fill="#333333">raw events → CSV</text>

  <!-- DB -->
  <rect x="170" y="444" width="260" height="92" rx="14" fill="#eef5ee" stroke="#5a8f5a" stroke-width="1.5"/>
  <text x="300" y="482" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">SQLite database</text>
  <text x="300" y="500" text-anchor="middle" font-size="12" fill="#333333">events + ranges</text>

  <!-- Output -->
  <rect x="560" y="444" width="320" height="92" rx="10" fill="#f5f5f5" stroke="#333333" stroke-width="1.5"/>
  <text x="720" y="482" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Result dialogs</text>
  <text x="720" y="500" text-anchor="middle" font-size="12" fill="#333333">CSV / HTML export</text>

  <!-- Legend -->
  <g font-size="11.5" fill="#333333">
    <rect x="20" y="576" width="14" height="14" rx="3" fill="#ffffff" stroke="#333333"/>
    <text x="40" y="587">Entry / output</text>

    <rect x="150" y="576" width="14" height="14" rx="3" fill="#e8eef7" stroke="#3a6ea5"/>
    <text x="170" y="587">Orchestration (gui/)</text>

    <rect x="320" y="576" width="14" height="14" rx="3" fill="#fdf3e3" stroke="#b8860b"/>
    <text x="340" y="587">Independent extension point</text>

    <rect x="540" y="576" width="14" height="14" rx="3" fill="#eef5ee" stroke="#5a8f5a"/>
    <text x="560" y="587">Shared data store</text>

    <line x1="700" y1="583" x2="730" y2="583" stroke="#555555" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="738" y="587">Direct cross-package link (Shockwave only)</text>
  </g>

  <text x="20" y="615" font-size="11" fill="#777777">gui does not import comp/plot/data_import logic back — data only flows through the SQLite tables, except the one Shockwave link noted above.</text>
</svg>
